app = "n8n-guild"
primary_region = "ord"

[build]
  image = "n8nio/n8n:latest"

[env]
  N8N_PORT = "5678"
  N8N_HOST = "n8n-guild.fly.dev"
  N8N_PROTOCOL = "https"
  WEBHOOK_URL = "https://n8n-guild.fly.dev/"

[http_service]
  internal_port = 5678
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

[mounts]
  source = "n8n_data"
  destination = "/home/node/.n8n"
