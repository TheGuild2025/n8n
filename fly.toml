app = "constellarium-n8n"
primary_region = "ord"

[build]

[env]
  N8N_HOST = "0.0.0.0"
  N8N_PORT = "8080"
  N8N_PROTOCOL = "https"
  N8N_EDITOR_BASE_URL = "https://constellarium-n8n.fly.dev"
  WEBHOOK_URL = "https://constellarium-n8n.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

[[mounts]]
  source = "n8n_data"
  destination = "/home/node/.n8n"
