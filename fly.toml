app = "constellarium-n8n"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = 5678

[http_service]
  internal_port       = 5678
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source      = "n8n_data"
  destination = "/home/node/.n8n"
 
[[statics]]
  guest_path = "/app/UI"
  url_prefix = "/"

