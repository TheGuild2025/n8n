app = "n8n-guild"
primary_region = "ord"

[build]
  image = "n8nio/n8n:latest"

[env]
  # Make n8n bind correctly for Fly
  N8N_HOST = "0.0.0.0"
  N8N_PORT = "8080"

  # External URLs for webhooks/editor
  N8N_EDITOR_BASE_URL = "https://n8n-guild.fly.dev"
  N8N_PROTOCOL = "https"
  WEBHOOK_URL = "https://n8n-guild.fly.dev/"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

[[mounts]]
  source = "n8n_data"
  destination = "/home/node/.n8n"

